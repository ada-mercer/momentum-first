# Manuscript status ledger — CANONICAL SINGLE SOURCE OF TRUTH.
#
# The status table rendered in the book (manuscript/backmatter/manuscript-status.qmd) is
# GENERATED from this file by tooling/scripts/build_manuscript_status.py. Do not edit the
# rendered table by hand; edit this file and re-render (the generator runs at
# pre-render, so a normal `quarto render` keeps them in sync).
#
# Field vocabulary:
#   maturity:     seed | working_draft | stabilizing | mature
#   verification: none | V1 | V2 | V3   (tiers defined in docs/VERIFICATION_POLICY.md)
#
# Contribution/authorship facts are the same across the manuscript, so they live
# once here as defaults rather than being repeated per chapter. Authorship policy
# (author = Arne; AI-assisted contribution credited separately; contribution vs.
# verification distinct) is explained in the Preface, not duplicated here.

defaults:
  contributors:
    - Arne Klaveness
    - AI-assisted
  contribution_note: >
    Arne supplied the core framing and acceptance direction; AI-assisted
    contribution shaped drafting, structure, and review.

# Verification below records the distinct review passes current through the v0.3.7
# candidate. It is independent of section-level human verification in
# docs/provenance/section-ledger.yml.
chapters:
  - id: introduction
    title: Introduction
    maturity: stabilizing
    verification: V2
    verified_by: AI-assisted review
    note: Framing and motivation; conceptually reviewed, but not load-bearing for later derivations.

  - id: foundations
    title: Foundations
    maturity: stabilizing
    verification: V3
    verified_by: AI-assisted review
    note: Primitive variables, ADMC, and the invertible mappings — the load-bearing locks.

  - id: gravity
