name: Validate Repo

on:
  workflow_dispatch:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
          cache: pip
          cache-dependency-path: tooling/ci/requirements-minimal.txt

      - name: Install minimal Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r tooling/ci/requirements-minimal.txt

      - name: Verify repository dependencies
        run: .venv/bin/python tooling/scripts/check_dependencies.py --mode minimal

      - name: Run repository test suite
        run: .venv/bin/python -m pytest tooling/tests

      - name: Check manuscript includes, assets, and explicit cross-references
        run: .venv/bin/python tooling/scripts/check_crossrefs.py

      - name: Verify generated manuscript status is current
        run: |
          .venv/bin/python tooling/scripts/build_manuscript_status.py
          git diff --exit-code -- manuscript/backmatter/_manuscript-status-table.md
