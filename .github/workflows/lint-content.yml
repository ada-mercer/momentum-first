name: Validate Repo

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
          cache: pip
          cache-dependency-path: tooling/ci/requirements-minimal.txt

      - name: Install minimal Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r tooling/ci/requirements-minimal.txt

      - name: Validate repository
        run: .venv/bin/python tooling/scripts/validate.py
