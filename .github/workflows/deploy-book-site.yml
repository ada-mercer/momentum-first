name: Deploy Book Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '_quarto.yml'
      - '_quarto-html.yml'
      - 'index.qmd'
      - 'googled99b772d08f0333f.html'
      - 'manuscript/**'
      - 'rendering/**'
      - 'figures/build/**'
      - 'tooling/**'
      - 'docs/provenance/**'
      - 'figures/figures.yml'
      - 'figures/src/**'
      - 'figures/lib/**'
      - '.github/workflows/**'
      - 'VERSION'
      - 'CITATION.cff'
      - '.zenodo.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
          cache: pip
          cache-dependency-path: tooling/ci/requirements-minimal.txt

      - name: Install minimal Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r tooling/ci/requirements-minimal.txt

      - name: Set up pinned Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.36'

      - name: Validate before deploying
        run: .venv/bin/python tooling/scripts/validate.py

      - name: Render HTML book
        run: |
          quarto render --profile html

      - name: Add latest release PDF to site artifact
        run: |
          curl --fail --location \
            https://github.com/ada-mercer/momentum-first/releases/latest/download/Momentum-First.pdf \
            --output _book/Momentum-First.pdf
          test -s _book/Momentum-First.pdf

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
