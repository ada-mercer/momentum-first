name: Release Book

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ada-mercer/momentum-first-build@sha256:b84ecafd7849b0edaaf82f3faf699dfb9780f32f522dfc6fe477752f7566ee4e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare pinned environment
        run: |
          ln -s /opt/momentum-first/venv .venv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify publication dependencies
        run: .venv/bin/python tooling/scripts/check_dependencies.py --mode publication

      - name: Run release validation
        run: |
          .venv/bin/python -m pytest tooling/tests
          .venv/bin/python tooling/scripts/check_crossrefs.py
          .venv/bin/python tooling/scripts/build_manuscript_status.py
          git diff --exit-code -- manuscript/backmatter/_manuscript-status-table.md
          .venv/bin/python tooling/scripts/build_figures.py
          .venv/bin/python tooling/scripts/check_figure_reproducibility.py

      - name: Verify tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match VERSION=$VERSION" >&2
            exit 1
          fi

      - name: Render PDF
        run: quarto render --profile pdf

      - name: Prepare PDF release artifact
        run: |
          set -euo pipefail
          PDF_PATH="$(find _book -type f -name '*.pdf' | sort | head -n 1 || true)"
          if [ -z "$PDF_PATH" ]; then
            echo "No PDF was produced under _book/" >&2
            exit 1
          fi

          cp "$PDF_PATH" Momentum-First.pdf
          test -s Momentum-First.pdf

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Momentum-First.pdf --clobber
          else
            gh release create "$GITHUB_REF_NAME" Momentum-First.pdf \
              --title "Momentum First $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      - name: Preserve exact PDF for DOI publication
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-manuscript-${{ github.ref_name }}
          path: Momentum-First.pdf
          if-no-files-found: error
          retention-days: 7

  zenodo-manuscript:
    name: Publish manuscript DOI version
    needs: release
    if: ${{ vars.ZENODO_MANUSCRIPT_CONCEPT_ID != '' }}
    runs-on: ubuntu-latest
    environment: zenodo-production
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'

      - name: Download exact release PDF
        uses: actions/download-artifact@v4
        with:
          name: zenodo-manuscript-${{ github.ref_name }}

      - name: Publish or verify Zenodo manuscript version
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_MANUSCRIPT_CONCEPT_ID: ${{ vars.ZENODO_MANUSCRIPT_CONCEPT_ID }}
        run: |
          set -euo pipefail
          PUBLICATION_DATE="$(
            sed -nE \
              's/^date-released:[[:space:]]*"?([0-9]{4}-[0-9]{2}-[0-9]{2})"?$/\1/p' \
              CITATION.cff | head -n 1
          )"
          test -n "$PUBLICATION_DATE"
          python3 tooling/scripts/publish_zenodo.py publish \
            --pdf Momentum-First.pdf \
            --version "$(tr -d '[:space:]' < VERSION)" \
            --publication-date "$PUBLICATION_DATE" \
            --github-release-url \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --concept-record-id "$ZENODO_MANUSCRIPT_CONCEPT_ID" \
            --confirm-publication \
            --output "$RUNNER_TEMP/zenodo-result.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"
