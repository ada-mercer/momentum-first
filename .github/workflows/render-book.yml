name: Render Book Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ada-mercer/momentum-first-build@sha256:b84ecafd7849b0edaaf82f3faf699dfb9780f32f522dfc6fe477752f7566ee4e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare pinned environment
        run: |
          ln -s /opt/momentum-first/venv .venv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate publication inputs
        run: .venv/bin/python tooling/scripts/validate.py --publication

      - name: Render PDF preview
        run: quarto render --profile pdf

      - name: Prepare PDF preview artifact
        run: |
          set -euo pipefail
          test -s _book/Momentum-First.pdf
          cp _book/Momentum-First.pdf Momentum-First.pdf
          test -s Momentum-First.pdf

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-First-preview-${{ github.sha }}
          path: Momentum-First.pdf
          if-no-files-found: error
