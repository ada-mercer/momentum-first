name: Build CI Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ci-image.yml'
      - 'tooling/ci/image/**'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-ci-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tooling/ci/image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ada-mercer/momentum-first-build:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/ada-mercer/momentum-first-build
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image reference
        run: |
          {
            echo '## Published CI image'
            echo
            echo '`ghcr.io/ada-mercer/momentum-first-build@${{ steps.build.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
