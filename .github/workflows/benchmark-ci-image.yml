name: Benchmark CI Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  publication:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ada-mercer/momentum-first-build@sha256:b84ecafd7849b0edaaf82f3faf699dfb9780f32f522dfc6fe477752f7566ee4e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare pinned environment
        run: |
          ln -s /opt/momentum-first/venv .venv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Record benchmark start
        id: benchmark
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Validate publication inputs
        run: .venv/bin/python tooling/scripts/validate.py --publication

      - name: Render PDF benchmark
        run: quarto render --profile pdf

      - name: Validate PDF artifact
        run: |
          set -euo pipefail
          test -s _book/Momentum-First.pdf
          cp _book/Momentum-First.pdf Momentum-First.pdf
          test -s Momentum-First.pdf
          test "$(pdfinfo Momentum-First.pdf | awk '/^Pages:/ {print $2}')" -gt 0
          if pdffonts Momentum-First.pdf | tail -n +3 | \
              grep -Eq '[[:space:]]no[[:space:]]+(yes|no)[[:space:]]+(yes|no)[[:space:]]+[0-9]+[[:space:]]+[0-9]+$'; then
            echo 'PDF contains an unembedded font' >&2
            exit 1
          else
            echo '[ok] all PDF fonts are embedded'
          fi

      - name: Record benchmark result
        run: |
          ELAPSED=$(($(date +%s) - ${{ steps.benchmark.outputs.started }}))
          {
            echo '## Pinned-image benchmark'
            echo
            echo "Publication validation and PDF render: ${ELAPSED}s"
            echo
            cat tooling/ci/image/reference.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark PDF
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-First-image-benchmark-${{ github.sha }}
          path: Momentum-First.pdf
          if-no-files-found: error
          retention-days: 7
