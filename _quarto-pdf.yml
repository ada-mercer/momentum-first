format:
  pdf:
    output-file: Momentum-First.pdf
    filters:
      - rendering/filters/remove-empty-pdf-index.lua
    toc: true
    toc-depth: 1
    colorlinks: true
    linkcolor: black
    urlcolor: black
    citecolor: black
    toccolor: black
    include-in-header:
      - rendering/styles/pdf/preamble.tex
      - rendering/styles/pdf/macros.tex
      - text: |
          % Add leaders so page targets scan clearly in print/PDF.
          \RedeclareSectionCommand[toclinefill=\TOCLineLeaderFill]{chapter}
